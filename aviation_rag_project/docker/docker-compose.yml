services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Explicit, stable image name/tag - without this, Compose derives the
    # tag from the project name (which defaults to the *compose file's
    # parent directory* name, not this project's name, and is easy to get
    # wrong when scripting `docker save` for offline transfer below).
    image: aviation_rag_api:latest
    container_name: aviation_rag_api
    restart: unless-stopped
    environment:
      - AVIATION_RAG_API_KEY=${AVIATION_RAG_API_KEY:?set AVIATION_RAG_API_KEY in your .env file}
      - AVIATION_RAG_DB_PATH=/app/aviation_vector_db
      - AVIATION_RAG_SNAG_HISTORY_PATH=/app/data/snag_history.json
      # Belt-and-braces: chromadb's telemetry default is already disabled
      # in code (Settings(anonymized_telemetry=False)) and in the image
      # (ENV in the Dockerfile) - set again here so it's obvious from this
      # file alone that no analytics call is made at runtime.
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      # Standalone ChromaDB persistent storage: its own named volume,
      # independent of the app container's filesystem, so the vector
      # index survives image rebuilds and container recreation.
      - chroma_data:/app/aviation_vector_db
      # Source manuals / snag history: mounted READ-ONLY so the running
      # container can never modify or delete the data it was trained on.
      - ../data:/app/data:ro
    ports:
      - "8000:8000"
    networks:
      - aviation_rag_net
    # No external network egress required - this is a fully air-gapped
    # local service once the image is built.

networks:
  aviation_rag_net:
    driver: bridge
    # internal: true removes this network's route to the outside world -
    # containers on it cannot reach the internet even if something in the
    # app (a bug, a compromised dependency) tries to. This does NOT block
    # the host from reaching the container: the `ports:` mapping above is
    # a separate host->container forwarding rule, unaffected by this
    # setting, so `curl http://localhost:8000/health` from the host still
    # works exactly as before.
    #
    # Note: air-gapping itself is a property of the HOST machine/network
    # having no physical or logical route to the internet - that has to
    # be enforced by your infrastructure, not by this file. This setting
    # is a second layer of defense on top of that, not a substitute for it.
    internal: true

volumes:
  chroma_data:
